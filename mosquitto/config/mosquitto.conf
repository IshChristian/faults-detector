# Mosquitto broker for VisionGuard AI.
# Before first start, create the password and ACL files (both git-ignored):
#   see 13-installation-guide.md, section "Create MQTT users".

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
