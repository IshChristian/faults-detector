[project]
name = "visionguard-backend"
version = "0.1.0"
description = "VisionGuard AI backend API and worker"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "pyjwt==2.10.1",
    "redis==5.2.1",
    "rq==2.1.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "onnxruntime==1.20.1",
    "supervision==0.26.1",
    "scipy==1.15.1",
    "pyarrow==18.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "fakeredis==2.26.2",
]

[tool.uv]
package = false
# supervision pulls in the GUI opencv-python; only the headless build is wanted.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "model: needs the real ONNX detection model (models/rfdetr-nano.onnx); skipped when absent",
]
filterwarnings = [
    # fakeredis lacks CLIENT SETNAME; real Valkey supports it.
    "ignore:CLIENT SETNAME command not supported:Warning",
]
